name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Lint, types et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint et Prettier
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Build
        run: npx astro build
